name: Release ZIP

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 9.9.0)"
        required: true
        default: "9.9.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          TAG_REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${TAG_REF}" == refs/tags/v* ]]; then
            VERSION="${TAG_REF#refs/tags/v}"
            TAG="v${VERSION}"
            NAME="JMod v${VERSION}"
          elif [[ "${TAG_REF}" == refs/heads/main ]]; then
            SHORT="${SHORT_SHA:0:7}"
            VERSION="build.${RUN_NUMBER}.${SHORT}"
            TAG="auto-${RUN_NUMBER}-${SHORT}"
            NAME="JMod Auto Build #${RUN_NUMBER} (${SHORT})"
          else
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
            NAME="JMod v${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3.31"
          extensions: dom, gd, mbstring, pdo, simplexml, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install PHP production dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build production assets
        run: npm run production

      - name: Prepare release package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          rm -rf node_modules
          rm -rf .git .github
          rm -rf tests
          rm -rf storage/logs/*
          rm -rf storage/cache/*

          mkdir -p release

          zip -r "release/jmod-${VERSION}.zip" . \
            -x "release/*" \
            -x "*.git*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "*.DS_Store"

          sha256sum "release/jmod-${VERSION}.zip" > "release/jmod-${VERSION}.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref, 'refs/heads/main') }}
          files: |
            release/jmod-${{ steps.version.outputs.version }}.zip
            release/jmod-${{ steps.version.outputs.version }}.zip.sha256
